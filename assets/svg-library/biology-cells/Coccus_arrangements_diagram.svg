<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" height="100%">
  <defs>
    <radialGradient id="sphereGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="40%" stop-color="#90caf9"/>
      <stop offset="80%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </radialGradient>
    <radialGradient id="backSphereGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e3f2fd" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#90caf9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e88e5" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; fill: #212121; text-anchor: middle; font-weight: 500; }
    .desc { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #757575; text-anchor: middle; line-height: 1.4; }
    .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #9e9e9e; }
    .grid-line { stroke: #e0e0e0; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .pointer { stroke: #9e9e9e; stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
    .cell { stroke: #1565c0; stroke-width: 1.2; }
    .cell-back { stroke: #1565c0; stroke-width: 1; stroke-opacity: 0.5; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <line x1="260" y1="20" x2="260" y2="380" class="grid-line" />
  <line x1="520" y1="20" x2="520" y2="380" class="grid-line" />
  <line x1="45" y1="410" x2="955" y2="410" class="grid-line" />

  <g transform="translate(130, 0)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Кок</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Ziarniak</text>
      <text x="0" y="45" class="title">Coccus</text>
    </switch>
    <circle cx="0" cy="240" r="40" fill="url(#sphereGrad)" class="cell" filter="url(#shadow)"/>
    <switch>
      <text x="0" y="340" class="desc" systemLanguage="uk">одиночна сферична клітина</text>
      <text x="0" y="340" class="desc" systemLanguage="pl">pojedyncza komórka sferyczna</text>
      <text x="0" y="340" class="desc">single spherical cell</text>
    </switch>
  </g>

  <g transform="translate(390, 0)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Диплокок</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Dwoinka</text>
      <text x="0" y="45" class="title">Diplococcus</text>
    </switch>
    <circle cx="-33" cy="240" r="40" fill="url(#sphereGrad)" class="cell" filter="url(#shadow)"/>
    <circle cx="33" cy="240" r="40" fill="url(#sphereGrad)" class="cell" filter="url(#shadow)"/>
    <switch>
      <text x="0" y="340" class="desc" systemLanguage="uk">пара клітин, поділ в одній площині</text>
      <text x="0" y="340" class="desc" systemLanguage="pl">para komórek, podział w jednej płaszczyźnie</text>
      <text x="0" y="340" class="desc">pair of cells, division in one plane</text>
    </switch>
  </g>

  <g transform="translate(740, 0)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Стрептокок</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Paciorkowiec</text>
      <text x="0" y="45" class="title">Streptococcus</text>
    </switch>
    <g filter="url(#shadow)">
      <circle cx="-160" cy="225" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-105" cy="220" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-50" cy="215" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="5" cy="218" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="60" cy="230" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="110" cy="252" r="30" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="145" cy="290" r="30" fill="url(#sphereGrad)" class="cell"/>
    </g>
    <switch>
      <text x="0" y="350" class="desc" systemLanguage="uk">ланцюжок клітин, поділ в одній площині</text>
      <text x="0" y="350" class="desc" systemLanguage="pl">łańcuszek komórek, podział w jednej płaszczyźnie</text>
      <text x="0" y="350" class="desc">chain of cells, division in one plane</text>
    </switch>
  </g>

  <g transform="translate(150, 430)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Тетрада</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Tetrada</text>
      <text x="0" y="45" class="title">Tetrad</text>
    </switch>
    <g filter="url(#shadow)">
      <circle cx="-32" cy="168" r="36" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="32" cy="168" r="36" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-32" cy="232" r="36" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="32" cy="232" r="36" fill="url(#sphereGrad)" class="cell"/>
    </g>
    <switch>
      <g systemLanguage="uk">
        <text x="0" y="325" class="desc">4 клітини після поділу</text>
        <text x="0" y="345" class="desc">у 2 взаємно перпендикулярних</text>
        <text x="0" y="365" class="desc">площинах</text>
      </g>
      <g systemLanguage="pl">
        <text x="0" y="325" class="desc">4 komórki po podziale</text>
        <text x="0" y="345" class="desc">w 2 wzajemnie prostopadłych</text>
        <text x="0" y="365" class="desc">płaszczyznach</text>
      </g>
      <g>
        <text x="0" y="325" class="desc">4 cells after division</text>
        <text x="0" y="345" class="desc">in 2 mutually perpendicular</text>
        <text x="0" y="365" class="desc">planes</text>
      </g>
    </switch>
  </g>

  <g transform="translate(480, 430)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Сарцина</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Pakietowiec</text>
      <text x="0" y="45" class="title">Sarcina</text>
    </switch>

    <circle cx="-40" cy="145" r="32" fill="url(#backSphereGrad)" class="cell-back"/>
    <circle cx="20" cy="135" r="32" fill="url(#backSphereGrad)" class="cell-back"/>
    <circle cx="-40" cy="205" r="32" fill="url(#backSphereGrad)" class="cell-back"/>
    <circle cx="20" cy="195" r="32" fill="url(#backSphereGrad)" class="cell-back"/>

    <path d="M -92,145 Q -70,150 -40,158" class="pointer"/>
    <circle cx="-40" cy="158" r="2" fill="#9e9e9e"/>
    <switch>
      <text x="-135" y="148" class="label" systemLanguage="uk">задній шар</text>
      <text x="-135" y="148" class="label" systemLanguage="pl">tylna warstwa</text>
      <text x="-135" y="148" class="label">back layer</text>
    </switch>

    <g filter="url(#shadow)">
      <circle cx="-5" cy="165" r="32" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="55" cy="155" r="32" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-5" cy="225" r="32" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="55" cy="215" r="32" fill="url(#sphereGrad)" class="cell"/>
    </g>

    <switch>
      <g systemLanguage="uk">
        <text x="0" y="325" class="desc">пакет із 8 клітин після поділу</text>
        <text x="0" y="345" class="desc">у 3 взаємно перпендикулярних</text>
        <text x="0" y="365" class="desc">площинах</text>
      </g>
      <g systemLanguage="pl">
        <text x="0" y="325" class="desc">pakiet 8 komórek po podziale</text>
        <text x="0" y="345" class="desc">w 3 wzajemnie prostopadłych</text>
        <text x="0" y="365" class="desc">płaszczyznach</text>
      </g>
      <g>
        <text x="0" y="325" class="desc">packet of 8 cells after division</text>
        <text x="0" y="345" class="desc">in 3 mutually perpendicular</text>
        <text x="0" y="365" class="desc">planes</text>
      </g>
    </switch>
  </g>

  <g transform="translate(810, 430)">
    <switch>
      <text x="0" y="45" class="title" systemLanguage="uk">Стафілокок</text>
      <text x="0" y="45" class="title" systemLanguage="pl">Gronkowiec</text>
      <text x="0" y="45" class="title">Staphylococcus</text>
    </switch>

    <g filter="url(#shadow)">
      <circle cx="-8" cy="155" r="28" fill="url(#backSphereGrad)" class="cell-back"/>
      <circle cx="18" cy="165" r="28" fill="url(#backSphereGrad)" class="cell-back"/>

      <circle cx="-45" cy="110" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="5" cy="102" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="48" cy="118" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="65" cy="160" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-55" cy="165" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-35" cy="210" r="31" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="45" cy="205" r="31" fill="url(#sphereGrad)" class="cell"/>

      <circle cx="-18" cy="130" r="33" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="24" cy="135" r="33" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="3" cy="185" r="33" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="-25" cy="170" r="33" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="28" cy="178" r="33" fill="url(#sphereGrad)" class="cell"/>
      <circle cx="5" cy="230" r="33" fill="url(#sphereGrad)" class="cell"/>
    </g>

    <switch>
      <g systemLanguage="uk">
        <text x="0" y="325" class="desc">скупчення клітин після поділу</text>
        <text x="0" y="345" class="desc">у кількох довільних</text>
        <text x="0" y="365" class="desc">площинах</text>
      </g>
      <g systemLanguage="pl">
        <text x="0" y="325" class="desc">skupiska komórek po podziale</text>
        <text x="0" y="345" class="desc">w kilku losowych</text>
        <text x="0" y="365" class="desc">płaszczyznach</text>
      </g>
      <g>
        <text x="0" y="325" class="desc">clusters of cells after division</text>
        <text x="0" y="345" class="desc">in several random</text>
        <text x="0" y="365" class="desc">planes</text>
      </g>
    </switch>
  </g>
</svg>
