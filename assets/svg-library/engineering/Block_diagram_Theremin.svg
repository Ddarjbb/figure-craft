<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="640">

  <title>Theremin Block Diagram</title>
  <desc>Block diagram of a Theremin. Volume control in blue, pitch control in yellow and audio output in red.</desc>

  <style type="text/css">
path {
  fill: none;
  stroke: #000;
  stroke-width: 4;
}

.block {
  fill: #fff;
  stroke: #000;
  stroke-width: 4;
}

text {
  fill: #000;
  font-family: sans-serif;
  font-size: 20px;
  text-anchor: middle;
}
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="260" fill="#ccf"/>
  <rect x="0" y="260" width="600" height="380" fill="#ff9"/>
  <rect x="600" y="260" width="300" height="380" fill="#ff8080"/>

  <!-- Lines -->
  <path d="M 50,80 L 80,110 L 110,80 M 80,80 V 190 H 680 V 450 M 50,420 L 80,450 L 110,420 M 80,420 V 530 H 380 V 380 H 230 M 380,450 H 830"/>

  <!-- Blocks -->

  <!-- Volume oscillator -->
  <g id="oscillator">
    <circle class="block" cx="230" cy="190" r="40"/>
    <path d="M 210,190 C 230,170 230,210 250,190"/>
  </g>

  <!-- Reference oscillator -->
  <use xlink:href="#oscillator" y="190"/>

  <!-- Pitch oscillator -->
  <use xlink:href="#oscillator" y="340"/>

  <!-- Band-pass filter -->
  <rect id="box" class="block" x="340" y="150" width="80" height="80"/>
  <path d="M 350,210 H 360 L 370,170 H 390 L 400,210 H 410"/>

  <!-- Mixer -->
  <circle class="block" cx="380" cy="450" r="40"/>
  <path d="M 352,422 L 408,478 M 352,478 L 408,422"/>

  <!-- Envelope detector -->
  <use xlink:href="#box" x="150"/>
  <path d="M 530,160 V 220 M 510,170 H 550 M 530,170 L 510,210 H 550 z"/>

  <!-- Low-pass filter -->
  <use xlink:href="#box" x="150" y="260"/>
  <path d="M 500,430 H 520 L 540,470 H 560"/>

  <!-- Amplifier -->
  <use xlink:href="#box" x="300" y="260"/>
  <path d="M 660,430 V 470 L 700,450 z"/>

  <!-- Speaker -->
  <path class="block" d="M 820,430 H 790 V 470 H 820 L 870,490 V 410 L 820,430 V 470"/>

  <!-- Text labels -->
  <switch>
    <g systemLanguage="de" > <!-- Taken verbatim from German translated version. I cannot guarantee accuracy. There might be mistakes in transcribing. -->
      <text x="80" y="40">Lautstärke-</text>
      <text x="80" y="60">antenne</text>
      <text x="80" y="380">Tonhöhen-</text>
      <text x="80" y="400">antenne</text>
      <text x="230" y="110">Lautstärke-</text>
      <text x="230" y="130">oszillator</text>
      <text x="230" y="300">Referenz-</text>
      <text x="230" y="320">ossillator</text>
      <text x="230" y="600">Tonhöhen-</text>
      <text x="230" y="620">oszillator</text>
      <text x="380" y="110">Bandpass-</text>
      <text x="380" y="130">Filter</text>
      <text x="380" y="570">Mischer</text>
      <text x="530" y="110">Hüllkurven</text>
      <text x="530" y="130">detektor</text>
      <text x="530" y="520">Tiefpass</text>
      <text x="530" y="540">Filter</text>
      <text x="680" y="530">Verstärker</text>
      <text x="830" y="520">Laut-</text>
      <text x="830" y="540">sprecher</text>
    </g>
    <g systemLanguage="en" > <!-- English -->
      <text x="80" y="40">Volume</text>
      <text x="80" y="60">antenna</text>
      <text x="80" y="380">Pitch</text>
      <text x="80" y="400">antenna</text>
      <text x="230" y="110">Volume</text>
      <text x="230" y="130">oscillator</text>
      <text x="230" y="300">Reference</text>
      <text x="230" y="320">oscillator</text>
      <text x="230" y="600">Pitch</text>
      <text x="230" y="620">oscillator</text>
      <text x="380" y="110">Band-pass</text>
      <text x="380" y="130">filter</text>
      <text x="380" y="570">Mixer</text>
      <text x="530" y="110">Envelope</text>
      <text x="530" y="130">detector</text>
      <text x="530" y="520">Low-pass</text>
      <text x="530" y="540">filter</text>
      <text x="680" y="530">Amplifier</text>
      <text x="830" y="530">Speaker</text>
    </g>
    <g systemLanguage="es" > <!-- Taken verbatim from Spanish translated version. I cannot guarantee accuracy. There might be mistakes in transcribing. -->
      <text x="80" y="40">Antena de</text>
      <text x="80" y="60">Volumen</text>
      <text x="80" y="380">Antena de</text>
      <text x="80" y="400">Frecuencia</text>
      <text x="230" y="110">Oscilador</text>
      <text x="230" y="130">de Volumen</text>
      <text x="230" y="300">Oscilador de</text>
      <text x="230" y="320">Referencia</text>
      <text x="230" y="600">Oscilador de</text>
      <text x="230" y="620">Frecuencia</text>
      <text x="380" y="110">Filtro de Paso</text>
      <text x="380" y="130">de Banda</text>
      <text x="380" y="570">Mezclador</text>
      <text x="530" y="110">Detector de</text>
      <text x="530" y="130">Envolvente</text>
      <text x="530" y="520">Filtro de</text>
      <text x="530" y="540">Banda Baja</text>
      <text x="680" y="530">Amplificador</text>
      <text x="830" y="530">Parlante</text>
    </g>
    <g> <!-- English -->
      <text x="80" y="40">Volume</text>
      <text x="80" y="60">antenna</text>
      <text x="80" y="380">Pitch</text>
      <text x="80" y="400">antenna</text>
      <text x="230" y="110">Volume</text>
      <text x="230" y="130">oscillator</text>
      <text x="230" y="300">Reference</text>
      <text x="230" y="320">oscillator</text>
      <text x="230" y="600">Pitch</text>
      <text x="230" y="620">oscillator</text>
      <text x="380" y="110">Band-pass</text>
      <text x="380" y="130">filter</text>
      <text x="380" y="570">Mixer</text>
      <text x="530" y="110">Envelope</text>
      <text x="530" y="130">detector</text>
      <text x="530" y="520">Low-pass</text>
      <text x="530" y="540">filter</text>
      <text x="680" y="530">Amplifier</text>
      <text x="830" y="530">Speaker</text>
    </g>
  </switch>
</svg>
