<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-130 -110 520 780">
 <title>circle division by chords</title>
 <desc>Illustration of the number of points (''n''), chords (''c'') and regions (''rG'') for first six terms of Moser's circle problem (OEIS A000127) by CMG Lee.</desc>
 <style type="text/css">
  #main  { font-family:Helvetica,Arial,sans-serif; font-size:40px; text-anchor:middle;
           fill:#000000; stroke:none; }
  .chord { stroke:#000000; }
  .var   { font-style:italic; }
  .sub   { font-size:50%; font-weight:bold; }
  .pass1 { fill-opacity:0.3; stroke-width:0.8; }
  .pass2 { fill-opacity:0;   stroke-width:1;   }
 </style>
 <defs>
  <g id="a1_"><path d="M  58.779, 80.902 A 100,100 0 0 1 -58.779, 80.902 Z"/><path class="chord" d="M  58.779, 80.902 L -58.779, 80.902"/></g>
  <g id="b1_"><path d="M -58.779, 80.902 A 100,100 0 0 1 -99.452, 10.453 Z"/><path class="chord" d="M -58.779, 80.902 L -99.452, 10.453"/></g>
  <g id="c1_"><path d="M -99.452, 10.453 A 100,100 0 0 1 -40.674,-91.355 Z"/><path class="chord" d="M -99.452, 10.453 L -40.674,-91.355"/></g>
  <g id="d1_"><path d="M -40.674,-91.355 A 100,100 0 0 1  40.674,-91.355 Z"/><path class="chord" d="M -40.674,-91.355 L  40.674,-91.355"/></g>
  <g id="a2_"><path d="M  58.779, 80.902 A 100,100 0 0 1 -99.452, 10.453 Z"/><path class="chord" d="M  58.779, 80.902 L -99.452, 10.453"/></g>
  <g id="b2_"><path d="M -58.779, 80.902 A 100,100 0 0 1 -40.674,-91.355 Z"/><path class="chord" d="M -58.779, 80.902 L -40.674,-91.355"/></g>
  <g id="c2_"><path d="M -99.452, 10.453 A 100,100 0 0 1  40.674,-91.355 Z"/><path class="chord" d="M -99.452, 10.453 L  40.674,-91.355"/></g>
  <g id="a3_"><path d="M  58.779, 80.902 A 100,100 0 0 0 -40.674,-91.355 Z"/><path class="chord" d="M  58.779, 80.902 L -40.674,-91.355"/></g>
  <g id="c3_"><path d="M -99.452, 10.453 A 100,100 0 1 1  99.452, 10.453 Z"/><path class="chord" d="M -99.452, 10.453 L  99.452, 10.453"/></g>
  <use  id="a1" xlink:href="#a1_"                         fill="#ff0000"/>
  <use  id="b1" xlink:href="#b1_"                         fill="#ff00ff"/>
  <use  id="c1" xlink:href="#c1_"                         fill="#0000ff"/>
  <use  id="d1" xlink:href="#d1_"                         fill="#00ccff"/>
  <use  id="e1" xlink:href="#c1_" transform="scale(-1,1)" fill="#00ff00"/>
  <use  id="f1" xlink:href="#b1_" transform="scale(-1,1)" fill="#ffcc00"/>
  <use  id="a2" xlink:href="#a2_"                         fill="#ff0000"/>
  <use  id="b2" xlink:href="#b2_"                         fill="#ff00ff"/>
  <use  id="c2" xlink:href="#c2_"                         fill="#0000ff"/>
  <use  id="d2" xlink:href="#c2_" transform="scale(-1,1)" fill="#00ccff"/>
  <use  id="e2" xlink:href="#b2_" transform="scale(-1,1)" fill="#00ff00"/>
  <use  id="f2" xlink:href="#a2_" transform="scale(-1,1)" fill="#ffcc00"/>
  <use  id="a3" xlink:href="#a3_"                         fill="#000000"/>
  <use  id="b3" xlink:href="#a3_" transform="scale(-1,1)" fill="#666666"/>
  <use  id="c3" xlink:href="#c3_"                         fill="#ffffff"/>
  <circle id="p" cx="0" cy="0" r="5" fill-opacity="1"/>
  <g id="p1">
   <circle r="100" fill="#eeeeee" stroke="#000000"/>
   <use xlink:href="#p" transform="translate(-99.452, 10.453)"/>
  </g>
  <g id="p2">
   <use xlink:href="#p1"/>
   <use xlink:href="#p" transform="translate( 58.779, 80.902)"/>
   <use xlink:href="#a2"/>
  </g>
  <g id="p3">
   <use xlink:href="#p2"/>
   <use xlink:href="#p" transform="translate( 40.674,-91.355)"/>
   <use xlink:href="#e2"/>
   <use xlink:href="#c2"/>
  </g>
  <g id="p4">
   <use xlink:href="#p3"/>
   <use xlink:href="#p" transform="translate(-40.674,-91.355)"/>
   <use xlink:href="#a3"/>
   <use xlink:href="#d1"/>
   <use xlink:href="#c1"/>
  </g>
  <g id="p5">
   <use xlink:href="#p4"/>
   <use xlink:href="#p" transform="translate(-58.779, 80.902)"/>
   <use xlink:href="#b3"/>
   <use xlink:href="#b2"/>
   <use xlink:href="#b1"/>
   <use xlink:href="#a1"/>
  </g>
  <g id="p6">
   <use xlink:href="#p5"/>
   <use xlink:href="#p" transform="translate( 99.452, 10.453)"/>
   <use xlink:href="#c3"/>
   <use xlink:href="#f2"/>
   <use xlink:href="#d2"/>
   <use xlink:href="#f1"/>
   <use xlink:href="#e1"/>
  </g>
 </defs>
 <circle cx="0" cy="0" r="99999" fill="#ffffff"/>
 <g id="main">
  <g transform="translate(0,0)">
   <use class="pass1" xlink:href="#p1"/>
   <use class="pass2" xlink:href="#p1"/>
   <text transform="translate(-16,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=1,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=0,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=1</tspan></text>
  </g>
  <g transform="translate(0,260)">
   <use class="pass1" xlink:href="#p2"/>
   <use class="pass2" xlink:href="#p2"/>
   <text transform="translate(-16,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=2,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=1,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=2</tspan></text>
  </g>
  <g transform="translate(0,520)">
   <use class="pass1" xlink:href="#p3"/>
   <use class="pass2" xlink:href="#p3"/>
   <text transform="translate(-16,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=3,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=3,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=4</tspan></text>
  </g>
  <g transform="translate(260,0)">
   <use class="pass1" xlink:href="#p4"/>
   <use class="pass2" xlink:href="#p4"/>
   <text transform="translate(-10,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=4,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=6,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=8</tspan></text>
  </g>
  <g transform="translate(260,260)">
   <use class="pass1" xlink:href="#p5"/>
   <use class="pass2" xlink:href="#p5"/>
   <text transform="translate(-10,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=5,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=10,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=16</tspan></text>
  </g>
  <g transform="translate(260,520)">
   <use class="pass1" xlink:href="#p6"/>
   <use class="pass2" xlink:href="#p6"/>
   <text transform="translate(-10,100) scale(0.95,1)" y="1.7ex"
   ><tspan class="var" dx="4">n</tspan><tspan>=6,</tspan
   ><tspan class="var" dx="4">c</tspan><tspan>=15,</tspan
   ><tspan class="var" dx="4">r</tspan
   ><tspan class="var sub" dx="-4" dy="8">G</tspan><tspan dy="-8">=31</tspan></text>
  </g>
 </g>
</svg>
